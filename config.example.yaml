app:
  base_url: https://sub2api.tcgcard.jp/sidecar
  base_path: /sidecar
  auth_username: admin
  access_key_ttl_hours: 12

database:
  url: sidecar-postgres
  port: 5432
  username: sub2api_sidecar
  name: sub2api_sidecar
  # Max physical connections in the shared connection pool (env DATABASE_POOL_MAX_SIZE,
  # default 10). One pool is shared per database URL for the whole process; keep this
  # comfortably below the PostgreSQL server's max_connections.
  pool_max_size: 10

openai:
  oauth_redirect_uri: https://sub2api.tcgcard.jp/sidecar/auth/callback

notifications:
  account_invalid_whitelist:
    ids: []
    names: []
    emails: []

sub2api:
  request_timeout_seconds: 30
  # Safety cap on how many usage-log rows a single fetch accumulates in memory.
  # 0 = unlimited (legacy). Prevents OOM when a day has a very large number of logs;
  # a hit is logged as a warning and may make that window's aggregates undercount.
  usage_log_max_items: 100000
  # Auto-retry count for transient upstream failures (429/5xx) on idempotent GETs only,
  # with exponential backoff honoring Retry-After (env SUB2API_REQUEST_MAX_RETRIES).
  # POST endpoints are never auto-retried. 0 disables retries.
  request_max_retries: 2
  # Thread-pool width for fetching every user's API keys in parallel
  # (env SUB2API_API_KEYS_FETCH_CONCURRENCY). Also sizes the HTTP connection pool.
  api_keys_fetch_concurrency: 8
  # Thread-pool width for fetching the remaining pages of paginated usage-log reads
  # in parallel once page 1 reveals the page count (env SUB2API_PAGE_FETCH_CONCURRENCY).
  page_fetch_concurrency: 8
  api_key_group_selection: random
  upstreams:
    - id: main
      name: 主站 Sub2API
      base_url: http://sub2api:8080
      admin_api_key_env: SUB2API_ADMIN_API_KEY

    - id: us-proxy-2
      name: US Proxy 2
      base_url: https://us-proxy-2.sub2api.tcgcard.jp
      admin_api_key_env: SUB2API_US_PROXY_2_ADMIN_API_KEY

  # 建号模板：sidecar 创建/更新账号时按这里的值填 payload。
  # 下面这一层是 base，平台差异写在末尾的 per_platform 里，只覆盖它点名的键。
  # base 分两类：
  #   1) 全平台通用：account_type / account_apikey_type / account_concurrency /
  #      account_priority / account_rate_multiplier / account_auto_pause_on_expired /
  #      account_temporary_unschedulable(_rules) / account_base_url / account_extra
  #      （熔断规则是通用 HTTP 错误码，所有平台同一套）
  #   2) 只作用于默认平台 account_platform（生产 = openai）：
  #      account_model_whitelist、account_ws_mode
  #      其他平台不继承这两项，必须在 per_platform.<平台> 里显式配置才生效；
  #      不配 = 不发 model_mapping / 不发 openai_oauth_responses_websockets_v2_* 键
  #      （上游对缺失 model_mapping 有运行时兜底，安全）。这样将来给 anthropic、
  #      gemini 建号时，不会被静默塞进 openai 的 gpt-5.x 模型映射。
  provisioning_defaults:
    account_concurrency: 6
    # Fallback platform, used only when a provisioning request (or key creation)
    # names no platform itself — /provision/start and /provision/apikey/start both
    # take an optional `platform` that wins over this. Any platform the upstream
    # groups declare is valid; OAuth provisioning currently implements openai and
    # grok (GET /api/provisioning/settings reports the live list).
    group_platform: openai
    # Ignored: upstream's account API has no `provider` field. Kept accepted so
    # existing configs keep loading; safe to delete.
    account_provider: openai
    # Fallback platform stamped on the account itself, same explicit-wins rule.
    account_platform: openai
    account_type: oauth
    account_apikey_type: api_key
    account_ws_mode: context_pool
    account_model_whitelist:
      - codex-auto-review
      - gpt-5.3-codex-spark
      - gpt-5.5
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-image-2
    account_temporary_unschedulable: true
    account_temporary_unschedulable_rules:
      - error_code: "529"
        duration_minutes: 60
        keywords:
          - overloaded
          - too many
        description: 服务过载 - 暂停 60 分钟
      - error_code: "429"
        duration_minutes: 10
        keywords:
          - rate limit
          - too many requests
        description: 触发限流 - 暂停 10 分钟
      - error_code: "503"
        duration_minutes: 30
        keywords:
          - unavailable
          - maintenance
        description: 服务不可用 - 暂停 30 分钟
    # 写进 credentials.base_url；留空表示不发这个键（openai 由上游自己填）。
    account_base_url: ""
    # 自由键值，合并进账号 extra。base 里放各平台通用的，平台专属的写 per_platform。
    account_extra: {}
    account_priority: 1
    account_rate_multiplier: 1
    account_auto_pause_on_expired: true

    # 平台维度的模板覆盖：平台名 -> 只写要改的键。
    # 不配 per_platform 时行为与没有这一节完全一致；下面 grok 这段是 sidecar 内置的
    # 默认值（照抄一遍只是为了可见），删掉也仍然生效，写在这里则以你的值为准。
    # 可覆盖的键：account_type / account_apikey_type / account_ws_mode /
    # account_base_url / account_concurrency / account_priority /
    # account_rate_multiplier / account_auto_pause_on_expired /
    # account_temporary_unschedulable / account_temporary_unschedulable_rules /
    # account_model_whitelist / account_extra
    per_platform:
      grok:
        # 恒等映射，与线上手工配置的 grok 账号一致；写成 [] 表示不发 model_mapping。
        account_model_whitelist:
          - composer-2.5
          - grok-4.5
          - grok-4.6
        # grok OAuth 账号走上游的代理域名；API Key 账号用的是 api.x.ai，两者不是一回事。
        account_base_url: https://cli-chat-proxy.grok.com/v1
        account_extra:
          grok_client_tool_cache_enabled: true
        # openai_oauth_responses_websockets_v2_* 是 openai responses 传输层的键，
        # grok 账号不带；ws_mode 置空即不下发这组键。
        account_ws_mode: ""
